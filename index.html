<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OS Ingestion</title>
    <meta name="description" content="Capture text, voice and screenshots straight into Google Workspace.">

    <!-- iOS Home Screen: full-screen, no Safari UI, content under the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ingest">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">

    <!-- iOS launch screens (portrait, current iPhones); without these iOS flashes white on launch -->
    <link rel="apple-touch-startup-image" href="/icons/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/icons/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">

    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <div class="app" id="app">
        <header class="topbar">
            <h1 class="title">Ingest</h1>
            <button type="button" class="pill" id="statusPill" aria-live="polite">
                <span class="pill-dot"></span><span class="pill-label">Ready</span>
            </button>
        </header>

        <div class="toast" id="toast" role="status" aria-live="polite" hidden>
            <span class="toast-text"></span>
            <button type="button" class="toast-action" hidden></button>
        </div>

        <main class="feed" id="feed">
            <div class="empty" id="empty">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M3.5 14.5h4l1.5 2.5h6l1.5-2.5h4"/><path d="M3.5 14.5V19a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4.5"/></svg>
                </div>
                <p class="empty-title">Ready to capture</p>
                <p class="empty-sub">Type, dictate, or paste a screenshot.<br>Works offline — captures sync when you're back online.</p>
            </div>
            <ol class="list" id="list"></ol>
        </main>

        <footer class="composer" id="composer">
            <div class="attachment" id="attachment" hidden>
                <img class="attachment-img" id="attachmentImg" alt="Attached image">
                <button type="button" class="attachment-remove" id="removeImage" aria-label="Remove image">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>

            <form class="composer-row" id="form" autocomplete="off">
                <input type="file" id="fileInput" accept="image/*" hidden>

                <button type="button" class="icon-btn" id="photoBtn" aria-label="Add photo">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-4.6-4.6a1.5 1.5 0 0 0-2.1 0L6 20"/></svg>
                </button>

                <button type="button" class="icon-btn" id="pasteBtn" aria-label="Paste screenshot">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V4"/><path d="M9 11h6M9 15h4"/></svg>
                </button>

                <div class="field">
                    <textarea id="input" rows="1" placeholder="Capture a thought…" enterkeyhint="enter" autocapitalize="sentences" spellcheck="true" aria-label="Note"></textarea>
                    <button type="button" class="mic-btn" id="micBtn" aria-label="Dictate" aria-pressed="false">
                        <svg class="mic-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
                        <span class="stop-icon" aria-hidden="true"></span>
                    </button>
                </div>

                <button type="submit" class="send-btn" id="sendBtn" aria-label="Send" disabled>
                    <span class="send-disc">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/></svg>
                    </span>
                </button>
            </form>
        </footer>
    </div>

    <noscript><p class="noscript">OS Ingestion needs JavaScript enabled.</p></noscript>
</body>
</html>
